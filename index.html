<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まぶのWebツール｜AEGIS Web・Quoteメーカー・話題ガチャ</title>
<meta name="description" content="まぶが作ったWebツールの置き場。地震・津波・天気の「AEGIS Web」、引用画像メーカー、話題ガチャ。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>まぶのWebツール</h1>
  <p class="lead">作ったWebサービスを置いている場所です。どれもブラウザだけで動きます。</p>
</header>

<main>
  <div class="cards">
    <a class="card" href="aegis/">
      <div class="card-icon" aria-hidden="true">🌏</div>
      <h2>AEGIS Web</h2>
      <p>地震・津波・緊急地震速報と天気をリアルタイムで表示する防災ダッシュボード。地図付き。</p>
      <span class="go">開く →</span>
    </a>

    <a class="card" href="quote/">
      <div class="card-icon" aria-hidden="true">💬</div>
      <h2>Make It a Quote Webメーカー</h2>
      <p>アバター画像とテキストから、あの引用画像（1200×630）をブラウザで生成。画像は端末の外に出ません。</p>
      <span class="go">開く →</span>
    </a>

    <a class="card" href="gacha/">
      <div class="card-icon" aria-hidden="true">🎲</div>
      <h2>話題ガチャ</h2>
      <p>雑談の話題に困ったときのガチャ。全109件の話題からランダムで1つ引きます。カテゴリ絞り込み・お気に入り付き。</p>
      <span class="go">開く →</span>
    </a>
  </div>
</main>

<footer>
  <p><a href="https://mabusaba.vercel.app">まぶ鯖 公式サイト</a> ／ <a href="https://github.com/i-mabu">GitHub: i-mabu</a></p>
</footer>
</body>
</html>
